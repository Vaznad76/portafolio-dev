<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Daniel Zavaleta | Portafolio</title>
</head>

<body>

    <header>


        <h1>Daniel Zavaleta</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Mis Metas</a></li>
                <li><a href="https://github.com">GitHub</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <p>Quiero aprender a programar como senior</p>
        <p>Estoy aprendiendo HTML</p>

        <section>
            <h2>Proyectos Destacados</h2>
            <article>
                <div id="contenedor-dinamico"></div>
                <h3>Mi Primer Sitio Web</h3>
                <img src="https://via.placeholder.com/300" alt="Imagen de ejempo">
                <p id="descripcion-proyecto">Tienda online</p>
                <a href="#" id="boton-detalles" class="btn-primario">Ver detalles</a>
            </article>
        </section>

        <section>
            <h2>Contáctame</h2>
            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Tu nombre completo" required>
                </p>
                <p>
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@dominio.com" required>
                </p>
                <button type="submit" class="btn-primario">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Daniel Zavaleta</p>
    </footer>

    <script src="app.js"></script>
